name: release

# 发布工作流：
# 1. 标签推送 (v*) 自动触发跨平台构建与正式发布
# 2. 亦可在 GitHub Actions 界面手动 (workflow_dispatch) 一键执行版本升级与发布
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "版本升级级别"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - manual
      custom_version:
        description: "手动指定版本号 (仅在选择 manual 时生效，例如 0.2.0)"
        required: false
        default: ""
        type: string
      draft:
        description: "保存为草稿 (Draft Release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve-tag.outputs.tag }}
      version: ${{ steps.resolve-tag.outputs.version }}
      draft: ${{ steps.resolve-tag.outputs.draft }}
      release_notes: ${{ steps.read-notes.outputs.notes }}

    steps:
      - name: Checkout repository (fetch full history for changelog)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Resolve target version & tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_TYPE="${{ github.event.inputs.bump_type }}"
            CUSTOM_VER="${{ github.event.inputs.custom_version }}"
            IS_DRAFT="${{ github.event.inputs.draft }}"

            if [ "$BUMP_TYPE" = "manual" ]; then
              if [ -z "$CUSTOM_VER" ]; then
                echo "❌ 错误: 选择 manual 模式时必须填写 custom_version"
                exit 1
              fi
              TARGET="$CUSTOM_VER"
            else
              TARGET="$BUMP_TYPE"
            fi

            # 配置 Git 提交身份
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # 执行本地发版脚本更新元数据与打标签
            node scripts/release.mjs "$TARGET" --allow-dirty

            # 获取刚打好的新版本
            NEW_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf-8')).version")
            NEW_TAG="v$NEW_VERSION"

            # 推送提交与新标签
            git push origin HEAD:main
            git push origin "$NEW_TAG"

            echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
          else
            TAG_NAME="${{ github.ref_name }}"
            VER_NAME="${TAG_NAME#v}"
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$VER_NAME" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Release Notes with git-cliff
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Read Release Notes into output
        id: read-notes
        run: |
          if [ -f RELEASE_NOTES.md ] && [ -s RELEASE_NOTES.md ]; then
            echo "notes<<EOF" >> "$GITHUB_OUTPUT"
            cat RELEASE_NOTES.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "notes=本次发布包含稳定性改进与日常优化。" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release Notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  publish-matrix:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "1"

    steps:
      - name: Checkout repository at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build & publish release bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "Canglang ${{ needs.prepare.outputs.tag }}"
          releaseBody: ${{ needs.prepare.outputs.release_notes }}
          releaseDraft: ${{ needs.prepare.outputs.draft == 'true' }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package & upload Windows Portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}"
          $exe = (Get-ChildItem -Path "target" -Filter "canglang-app.exe" -Recurse | Where-Object { $_.FullName -like "*release*" } | Select-Object -First 1).FullName
          if (-not $exe -or -not (Test-Path $exe)) {
            throw "未在 target 目录下找到编译生成的 canglang-app.exe"
          }
          Write-Host "找到 Windows 可执行文件: $exe"
          $portableDir = "canglang-portable"
          New-Item -ItemType Directory -Force -Path $portableDir
          Copy-Item $exe -Destination "$portableDir/Canglang.exe"
          New-Item -ItemType File -Path "$portableDir/.portable" -Force
          $zipName = "Canglang-$tag-windows-x64-portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipName -Force
          Write-Host "Uploading $zipName to release $tag..."
          gh release upload $tag $zipName --clobber
