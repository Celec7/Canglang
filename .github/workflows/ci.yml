name: ci

# 持续集成工作流：
# 在 PR 以及除发布标签外的分支 push 时触发
# 负责前端类型检查、状态与展示测试、Rust 格式检查、测试与 Clippy，以及编译验证
on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Test frontend state and presentation
        run: pnpm test

      - name: Format Rust
        run: cargo fmt --check

      - name: Test Rust
        run: cargo test

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release executable
        run: |
          pnpm exec tauri build --no-bundle
          cp target/release/canglang-app target/release/Canglang

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: Canglang-linux-amd64
          path: target/release/Canglang
          if-no-files-found: error
