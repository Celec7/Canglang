# git-cliff 配置文件
# https://git-cliff.org/docs/configuration

[changelog]
# CHANGELOG.md 头部
header = """
# 更新日志 (Changelog)

"""
# 单个版本渲染模板
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [未发布 (Unreleased)]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**破坏性变更**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif %}\
    {% endfor %}
{% endfor %}
"""
# 尾部
footer = """
<!-- 由 git-cliff 自动生成 -->
"""
# 移除两端空白
trim = true

[git]
# 开启 Conventional Commits 解析
conventional_commits = true
# 过滤非 Conventional Commits
filter_unconventional = false
# 分支或范围拆分
split_commits = false
# 提交预处理正则替换
commit_preprocessors = [
    # 移除关联的 Issue 编号等噪声（如有需要）
]
# 提交分组规则
commit_parsers = [
    { message = "^feat", group = "✨ 新增功能 (Features)" },
    { message = "^fix", group = "🐛 缺陷修复 (Bug Fixes)" },
    { message = "^perf", group = "⚡ 性能优化 (Performance)" },
    { message = "^refactor", group = "♻️ 代码重构 (Refactor)" },
    { message = "^docs", group = "📝 文档更新 (Documentation)" },
    { message = "^style", group = "🎨 界面与代码风格 (Style)" },
    { message = "^test", group = "🧪 测试相关 (Tests)" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps.*\\)", group = "📦 依赖升级 (Dependencies)" },
    { message = "^chore", group = "🔧 构建与日常维护 (Maintenance)" },
    { message = "^ci", group = "👷 持续集成 (CI/CD)" },
    { body = ".*security", group = "🛡️ 安全更新 (Security)" },
    { message = ".*", group = "📋 其他变更 (Other Changes)" },
]
# 保护破坏性变更
protect_breaking_commits = false
# 忽略的提交标签
filter_commits = false
# 标签匹配规则（匹配 v0.1.0 或 0.1.0）
tag_pattern = "v?[0-9].*"
# 忽略的标签
ignore_tags = ""
# 拓扑排序
topo_order = true
# 提交排序方式
sort_commits = "oldest"
